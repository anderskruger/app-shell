<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{APP_NAME}}</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14161b; color: #eeeae1;
         font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #999ba5; margin: 0 0 20px; max-width: 32ch; }
  button { font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 12px; border: 0; background: #eeeae1; color: #101114; }
</style>
</head>
<body>
  <div>
    <h1>{{APP_NAME}} needs signal once</h1>
    <p>Open it once with internet and it keeps working offline after that.</p>
    <button onclick="location.href='{{APP_URL}}'">Try again</button>
  </div>
</body>
</html>
